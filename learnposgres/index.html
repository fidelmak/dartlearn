
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostgresQuest — Learn PostgreSQL by Doing | Full Tutorial</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #0f1424;
    --border: #1e2a45;
    --pg-blue: #0064a5;
    --pg-cyan: #00c4d8;
    --pg-orange: #f7a41d;
    --pg-pink: #ff3cac;
    --success: #00ff87;
    --error: #ff4444;
    --text: #e8eaf6;
    --muted: #5a6a8a;
    --code-bg: #080c18;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(0,100,165,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,100,165,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,20,36,0.95);
    backdrop-filter: blur(12px);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 1.3rem;
    background: linear-gradient(90deg, var(--pg-blue), var(--pg-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo span { background: linear-gradient(90deg, var(--pg-orange), var(--pg-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .donate-badge {
    background: rgba(247,164,29,0.12);
    border: 1px solid var(--pg-orange);
    border-radius: 40px;
    padding: 6px 14px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--pg-orange);
    letter-spacing: 0.02em;
  }
  .donate-badge strong { color: white; font-family: monospace; }

  .progress-bar-wrap {
    flex: 1;
    max-width: 400px;
    min-width: 180px;
  }
  .progress-label {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pg-blue), var(--pg-cyan));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .stats {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 600;
    background: var(--border);
    padding: 5px 12px;
    border-radius: 99px;
  }
  .stat-pill.xp { color: var(--success); }
  .stat-pill.streak { color: var(--pg-orange); }
  .stat-pill.level { color: var(--pg-cyan); }

  .chapter-nav {
    display: flex;
    gap: 0;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.8);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chapter-nav::-webkit-scrollbar { display: none; }
  .chapter-tab {
    padding: 10px 20px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chapter-tab.active { color: var(--pg-cyan); border-bottom-color: var(--pg-cyan); }
  .chapter-tab.done { color: var(--success); }
  .chapter-tab.locked { opacity: 0.35; cursor: not-allowed; }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  .question-panel {
    width: 45%;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--panel);
  }
  .panel-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .step-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(0,100,165,0.12);
    color: var(--pg-cyan);
    border: 1px solid rgba(0,100,165,0.3);
  }
  .lesson-title { font-family: 'Unbounded', sans-serif; font-size: 0.85rem; font-weight: 700; }

  .question-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    scrollbar-width: thin;
  }
  .concept-block { margin-bottom: 24px; animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .concept-label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--pg-pink);
    margin-bottom: 8px;
  }
  .concept-text { font-size: 0.88rem; line-height: 1.7; color: #b8c5e0; }
  .concept-text code, .example-block code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--code-bg);
    color: var(--pg-orange);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.8rem;
  }
  .example-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 16px 0;
  }
  .example-block pre {
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    color: #e2e8f0;
  }
  .schema-block {
    background: rgba(0,196,216,0.05);
    border: 1px solid rgba(0,196,216,0.2);
    border-radius: 8px;
    padding: 12px;
    margin: 12px 0;
    font-size: 0.7rem;
    font-family: monospace;
  }
  .task-block {
    background: rgba(247,164,29,0.05);
    border: 1px solid rgba(247,164,29,0.2);
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
  }
  .task-title {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--pg-orange);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hint-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.7rem;
    margin-top: 12px;
  }
  .hint-reveal {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: rgba(247,164,29,0.05);
    border-left: 3px solid var(--pg-orange);
    font-family: monospace;
    font-size: 0.75rem;
  }
  .hint-reveal.show { display: block; }

  .editor-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--code-bg);
    overflow: hidden;
  }
  .editor-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,20,36,0.8);
  }
  .file-tab {
    font-family: monospace;
    font-size: 0.75rem;
    color: var(--pg-cyan);
    background: rgba(0,196,216,0.1);
    padding: 4px 14px;
    border-radius: 4px;
  }
  .editor-actions { display: flex; gap: 10px; }
  .run-btn {
    background: linear-gradient(135deg, var(--pg-blue), var(--pg-cyan));
    color: #000;
    border: none;
    padding: 6px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .editor-wrap { display: flex; flex: 1; overflow: hidden; }
  .line-nums {
    padding: 16px 0;
    text-align: right;
    font-family: monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: var(--muted);
    padding-right: 12px;
    padding-left: 10px;
    background: rgba(0,0,0,0.2);
    border-right: 1px solid var(--border);
    min-width: 48px;
  }
  #code-editor {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #eeffff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    padding: 16px;
    resize: none;
    white-space: pre;
    overflow: auto;
  }
  .output-panel {
    height: 170px;
    border-top: 1px solid var(--border);
    background: #05080f;
    display: flex;
    flex-direction: column;
  }
  .output-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .output-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .output-dot.success { background: var(--success); }
  .output-dot.error { background: var(--error); }
  #output-area {
    flex: 1;
    padding: 10px 16px;
    font-family: monospace;
    font-size: 0.75rem;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .feedback-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s;
  }
  .feedback-overlay.show { opacity: 1; pointer-events: all; }
  .feedback-card {
    background: var(--panel);
    border-radius: 24px;
    padding: 32px;
    text-align: center;
    max-width: 380px;
    border: 1px solid var(--pg-cyan);
  }
  .continue-btn {
    background: linear-gradient(135deg, var(--pg-blue), var(--pg-cyan));
    border: none;
    padding: 12px 28px;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
    color: #000;
  }
  .particle {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1000;
    animation: blast 0.8s ease-out forwards;
  }
  @keyframes blast {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
  .keyword { color: var(--pg-cyan); font-weight: 600; }
  .string { color: var(--pg-orange); }
  .number { color: var(--pg-pink); }
</style>
</head>
<body>

<header>
  <div class="logo">Postgres<span>Quest</span></div>
  <div class="donate-badge">🐘 Support PostgreSQL education — OPay: <strong>9072210193</strong> Paul</div>
  <div class="progress-bar-wrap">
    <div class="progress-label"><span id="chapter-name">PostgreSQL Basics</span><span id="step-counter">0/0</span></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="stats">
    <div class="stat-pill xp">⚡ <span id="xp-count">0</span> XP</div>
    <div class="stat-pill streak">🔥 <span id="streak-count">0</span></div>
    <div class="stat-pill level">Lv <span id="level-count">1</span></div>
  </div>
</header>

<nav class="chapter-nav" id="chapter-nav"></nav>

<div class="main">
  <div class="question-panel">
    <div class="panel-header"><div class="step-badge" id="step-badge">LESSON</div><div class="lesson-title" id="lesson-title">Intro to PostgreSQL</div></div>
    <div class="question-body" id="question-body"></div>
  </div>
  <div class="editor-panel">
    <div class="editor-topbar"><div class="file-tab">🐘 query.sql</div><div class="editor-actions"><button class="reset-btn" onclick="resetCode()">↺ Reset</button><button class="run-btn" onclick="checkCode()">▶ Run Query</button></div></div>
    <div class="editor-wrap"><div class="line-nums" id="line-nums">1</div><textarea id="code-editor" spellcheck="false" onkeydown="handleTab(event)" oninput="updateLineNums()"></textarea></div>
    <div class="output-panel"><div class="output-header"><div class="output-dot" id="output-dot"></div>POSTGRES OUTPUT</div><div id="output-area"><span class="out-muted">// Write PostgreSQL query and click Execute</span></div></div>
  </div>
</div>

<div class="feedback-overlay" id="feedback-overlay"><div class="feedback-card"><span class="feedback-emoji" id="feedback-emoji">🐘</span><div class="feedback-title" id="feedback-title">Correct!</div><div class="feedback-msg" id="feedback-msg"></div><div id="xp-gained" style="color:var(--pg-cyan); margin:12px 0; font-weight:bold;"></div><button class="continue-btn" onclick="nextStep()">Next Challenge →</button></div></div>

<script>
// ============================================================
// POSTGRESQL CURRICULUM — from basics to advanced features
// Window functions, CTE, Recursive queries, JSON, PL/pgSQL, Indexes
// ============================================================

const curriculum = [
  { id: 'basics', name: 'SELECT Basics', icon: '🔍', steps: [
    { title: 'Simple SELECT', badge: 'LESSON 1', xp: 30,
      question: `<div class="concept-block"><div class="concept-label">Retrieving Data</div><div class="concept-text">PostgreSQL uses standard SQL. <code>SELECT * FROM employees</code> returns all columns.</div></div>
      <div class="schema-block">📊 <strong>Table: employees</strong><br>emp_id | name | department | salary | hire_date</div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Select all columns from the <code>employees</code> table.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT * FROM employees;</div></div>`,
      starterCode: `-- Write your PostgreSQL query\n`,
      check: (code) => { const ok = /SELECT\s+\*\s+FROM\s+employees/i.test(code); return { ok, msg: ok ? '' : 'Use: SELECT * FROM employees;' }; }
    },
    { title: 'DISTINCT & ORDER BY', badge: 'LESSON 2', xp: 35,
      question: `<div class="concept-block"><div class="concept-label">Unique Values & Sorting</div><div class="concept-text"><code>SELECT DISTINCT</code> removes duplicates. <code>ORDER BY</code> sorts results.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Select all unique departments from employees, sorted alphabetically.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT DISTINCT department FROM employees ORDER BY department;</div></div>`,
      starterCode: `-- Unique departments sorted\n`,
      check: (code) => { const ok = /SELECT\s+DISTINCT\s+department\s+FROM\s+employees\s+ORDER\s+BY\s+department/i.test(code); return { ok, msg: 'SELECT DISTINCT department FROM employees ORDER BY department;' }; }
    }
  ]},
  { id: 'advanced-select', name: 'Advanced SELECT', icon: '⚡', steps: [
    { title: 'ILIKE (Case-Insensitive)', badge: 'PG FEATURE', xp: 45,
      question: `<div class="concept-block"><div class="concept-label">PostgreSQL ILIKE</div><div class="concept-text">Unlike standard <code>LIKE</code>, <code>ILIKE</code> is case-insensitive matching.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Find employees whose name contains 'ar' (case-insensitive) using <code>ILIKE</code>.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT * FROM employees WHERE name ILIKE '%ar%';</div></div>`,
      starterCode: `-- Case-insensitive search\n`,
      check: (code) => { const ok = /ILIKE/i.test(code); return { ok, msg: 'Use WHERE name ILIKE \'%ar%\'' }; }
    },
    { title: 'LIMIT & OFFSET', badge: 'LESSON 3', xp: 40,
      question: `<div class="concept-block"><div class="concept-label">Pagination</div><div class="concept-text"><code>LIMIT</code> restricts rows, <code>OFFSET</code> skips rows.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Get the 3 highest-paid employees (skip the top 1, show next 3).</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT * FROM employees ORDER BY salary DESC LIMIT 3 OFFSET 1;</div></div>`,
      starterCode: `-- Pagination with LIMIT OFFSET\n`,
      check: (code) => { const ok = /LIMIT\s+3\s+OFFSET\s+1/i.test(code) && /ORDER\s+BY\s+salary\s+DESC/i.test(code); return { ok, msg: 'ORDER BY salary DESC LIMIT 3 OFFSET 1' }; }
    }
  ]},
  { id: 'aggregates', name: 'Aggregates & GROUP BY', icon: '📊', steps: [
    { title: 'Basic Aggregates', badge: 'LESSON 1', xp: 50,
      question: `<div class="concept-block"><div class="concept-label">PostgreSQL Aggregate Functions</div><div class="concept-text"><code>AVG(), SUM(), COUNT(), MIN(), MAX()</code></div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Calculate the average salary and total number of employees.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT AVG(salary) AS avg_salary, COUNT(*) AS total_employees FROM employees;</div></div>`,
      starterCode: `-- avg salary and count\n`,
      check: (code) => { const ok = /AVG\s*\(\s*salary\s*\)/.test(code) && /COUNT\s*\(\s*\*\s*\)/.test(code); return { ok, msg: 'SELECT AVG(salary), COUNT(*) FROM employees' }; }
    },
    { title: 'GROUP BY HAVING', badge: 'LESSON 2', xp: 55,
      question: `<div class="concept-block"><div class="concept-label">Filter Groups</div><div class="concept-text"><code>HAVING</code> filters groups after aggregation, unlike <code>WHERE</code> which filters rows.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Show departments with average salary greater than 50000.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT department, AVG(salary) FROM employees GROUP BY department HAVING AVG(salary) > 50000;</div></div>`,
      starterCode: `-- Group by having\n`,
      check: (code) => { const ok = /GROUP\s+BY\s+department\s+HAVING\s+AVG\s*\(\s*salary\s*\)\s*>\s*50000/i.test(code); return { ok, msg: 'GROUP BY department HAVING AVG(salary) > 50000' }; }
    }
  ]},
  { id: 'joins', name: 'JOINs', icon: '🔗', steps: [
    { title: 'INNER JOIN', badge: 'LESSON 1', xp: 60,
      question: `<div class="concept-block"><div class="concept-label">Combining Tables</div><div class="concept-text"><code>INNER JOIN</code> returns rows with matching keys in both tables.</div></div>
      <div class="schema-block">📊 departments(dept_id, name) | employees(emp_id, name, dept_id)</div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Join employees with departments to show employee name and department name.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT e.name, d.name FROM employees e INNER JOIN departments d ON e.dept_id = d.dept_id;</div></div>`,
      starterCode: `-- INNER JOIN\n`,
      check: (code) => { const ok = /INNER\s+JOIN\s+departments\s+ON/i.test(code); return { ok, msg: 'Use INNER JOIN with ON condition' }; }
    },
    { title: 'FULL OUTER JOIN', badge: 'PG FEATURE', xp: 70,
      question: `<div class="concept-block"><div class="concept-label">All Rows from Both Tables</div><div class="concept-text"><code>FULL OUTER JOIN</code> returns all rows when there's a match in either table.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Show all employees and all departments, even if no match.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT * FROM employees e FULL OUTER JOIN departments d ON e.dept_id = d.dept_id;</div></div>`,
      starterCode: `-- FULL OUTER JOIN\n`,
      check: (code) => { const ok = /FULL\s+OUTER\s+JOIN\s+departments/i.test(code); return { ok, msg: 'Use FULL OUTER JOIN' }; }
    }
  ]},
  { id: 'window-functions', name: 'Window Functions', icon: '🪟', steps: [
    { title: 'ROW_NUMBER()', badge: 'ADVANCED', xp: 85,
      question: `<div class="concept-block"><div class="concept-label">PostgreSQL Window Functions</div><div class="concept-text"><code>ROW_NUMBER() OVER(PARTITION BY ... ORDER BY ...)</code> assigns sequential integers.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Assign a row number to each employee ordered by salary (highest first).</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT name, salary, ROW_NUMBER() OVER (ORDER BY salary DESC) as rank FROM employees;</div></div>`,
      starterCode: `-- Window function row_number\n`,
      check: (code) => { const ok = /ROW_NUMBER\s*\(\s*\)\s+OVER\s*\(/i.test(code) && /ORDER\s+BY\s+salary\s+DESC/i.test(code); return { ok, msg: 'Use ROW_NUMBER() OVER (ORDER BY salary DESC)' }; }
    },
    { title: 'RANK() & DENSE_RANK()', badge: 'ADVANCED', xp: 90,
      question: `<div class="concept-block"><div class="concept-label">Ranking with ties</div><div class="concept-text"><code>RANK()</code> leaves gaps, <code>DENSE_RANK()</code> doesn't.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Rank employees by salary using DENSE_RANK().</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT name, salary, DENSE_RANK() OVER (ORDER BY salary DESC) FROM employees;</div></div>`,
      starterCode: `-- DENSE_RANK\n`,
      check: (code) => { const ok = /DENSE_RANK\s*\(\s*\)\s+OVER/i.test(code); return { ok, msg: 'SELECT DENSE_RANK() OVER (ORDER BY salary DESC)' }; }
    }
  ]},
  { id: 'cte', name: 'CTE & Recursive', icon: '🔄', steps: [
    { title: 'Common Table Expression', badge: 'ADVANCED', xp: 80,
      question: `<div class="concept-block"><div class="concept-label">WITH Clause</div><div class="concept-text">CTEs make complex queries readable. Use <code>WITH cte_name AS (...)</code></div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Use a CTE to find departments with average salary > 60000.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">WITH dept_avg AS (SELECT dept_id, AVG(salary) avg_sal FROM employees GROUP BY dept_id) SELECT * FROM dept_avg WHERE avg_sal > 60000;</div></div>`,
      starterCode: `-- CTE example\n`,
      check: (code) => { const ok = /WITH\s+\w+\s+AS\s*\(/i.test(code); return { ok, msg: 'Define a CTE using WITH ... AS ()' }; }
    },
    { title: 'Recursive CTE', badge: 'EXPERT', xp: 120,
      question: `<div class="concept-block"><div class="concept-label">Hierarchical Queries</div><div class="concept-text">Recursive CTEs handle tree structures (org charts, categories).</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Assume employees table has manager_id. Write a recursive CTE to get all subordinates of employee with id=1.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">WITH RECURSIVE subordinates AS (SELECT * FROM employees WHERE emp_id=1 UNION ALL SELECT e.* FROM employees e INNER JOIN subordinates s ON e.manager_id=s.emp_id) SELECT * FROM subordinates;</div></div>`,
      starterCode: `-- Recursive CTE for hierarchy\n`,
      check: (code) => { const ok = /RECURSIVE/i.test(code) && /UNION\s+ALL/i.test(code); return { ok, msg: 'Use WITH RECURSIVE and UNION ALL' }; }
    }
  ]},
  { id: 'json', name: 'JSON Operations', icon: '📋', steps: [
    { title: 'JSON Functions', badge: 'PG FEATURE', xp: 95,
      question: `<div class="concept-block"><div class="concept-label">PostgreSQL JSON Support</div><div class="concept-text"><code>jsonb</code> type and operators: <code>->></code> (text), <code>-></code> (object).</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Assume table has a jsonb column 'data' with keys like 'name', 'age'. Extract the 'name' as text.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT data->>'name' FROM users;</div></div>`,
      starterCode: `-- JSON extraction\n`,
      check: (code) => { const ok = /->>/i.test(code); return { ok, msg: 'Use column->>\'key\' to extract JSON text' }; }
    },
    { title: 'JSON Aggregation', badge: 'ADVANCED', xp: 100,
      question: `<div class="concept-block"><div class="concept-label">Building JSON</div><div class="concept-text"><code>json_agg()</code> aggregates rows into JSON array.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Return all employees as a JSON array.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT json_agg(employees) FROM employees;</div></div>`,
      starterCode: `-- JSON aggregation\n`,
      check: (code) => { const ok = /json_agg/i.test(code); return { ok, msg: 'SELECT json_agg(employees) FROM employees;' }; }
    }
  ]},
  { id: 'plpgsql', name: 'PL/pgSQL', icon: '⚙️', steps: [
    { title: 'Stored Function', badge: 'EXPERT', xp: 130,
      question: `<div class="concept-block"><div class="concept-label">PostgreSQL Functions</div><div class="concept-text">Create functions in PL/pgSQL language.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Create a function <code>get_employee_count(dept_name TEXT)</code> that returns the number of employees in a department.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">CREATE OR REPLACE FUNCTION get_employee_count(dept_name TEXT) RETURNS INTEGER AS $$ DECLARE cnt INTEGER; BEGIN SELECT COUNT(*) INTO cnt FROM employees WHERE department = dept_name; RETURN cnt; END; $$ LANGUAGE plpgsql;</div></div>`,
      starterCode: `-- Create PL/pgSQL function\n`,
      check: (code) => { const ok = /CREATE\s+OR\s+REPLACE\s+FUNCTION/i.test(code) && /LANGUAGE\s+plpgsql/i.test(code); return { ok, msg: 'Define a plpgsql function with RETURNS INTEGER' }; }
    }
  ]},
  { id: 'indexes', name: 'Indexes & Performance', icon: '🚀', steps: [
    { title: 'Create Index', badge: 'PERFORMANCE', xp: 70,
      question: `<div class="concept-block"><div class="concept-label">Query Optimization</div><div class="concept-text">PostgreSQL supports B-tree, Hash, GIN, GiST indexes.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Create a B-tree index on the <code>salary</code> column of employees table.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">CREATE INDEX idx_salary ON employees(salary);</div></div>`,
      starterCode: `-- Create index on salary\n`,
      check: (code) => { const ok = /CREATE\s+INDEX\s+\w+\s+ON\s+employees\s*\(\s*salary\s*\)/i.test(code); return { ok, msg: 'CREATE INDEX idx_salary ON employees(salary);' }; }
    },
    { title: 'Partial Index', badge: 'ADVANCED', xp: 85,
      question: `<div class="concept-block"><div class="concept-label">Conditional Indexes</div><div class="concept-text">Partial indexes only include rows matching a WHERE clause.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Create a partial index on employees with salary > 70000.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">CREATE INDEX idx_high_salary ON employees(salary) WHERE salary > 70000;</div></div>`,
      starterCode: `-- Partial index\n`,
      check: (code) => { const ok = /CREATE\s+INDEX.*WHERE\s+salary\s*>\s*70000/i.test(code); return { ok, msg: 'CREATE INDEX ... WHERE salary > 70000' }; }
    }
  ]}
];

// State
let state = {
  chapterIdx: 0, stepIdx: 0, xp: 0, streak: 0,
  completedSteps: new Set(),
  completedChapters: new Set(),
  hintUsed: false
};

function buildChapterNav() {
  const nav = document.getElementById('chapter-nav');
  nav.innerHTML = '';
  curriculum.forEach((ch, i) => {
    const tab = document.createElement('div');
    tab.className = `chapter-tab ${i === state.chapterIdx ? 'active' : ''} ${state.completedChapters.has(i) ? 'done' : ''} ${!isUnlocked(i) ? 'locked' : ''}`;
    tab.textContent = ch.icon + ' ' + ch.name;
    tab.onclick = () => { if(isUnlocked(i)) { state.chapterIdx = i; state.stepIdx = 0; buildChapterNav(); loadStep(); } };
    nav.appendChild(tab);
  });
}
function isUnlocked(i) { if(i===0) return true; return state.completedChapters.has(i-1) || state.chapterIdx === i; }

function loadStep() {
  const ch = curriculum[state.chapterIdx];
  const step = ch.steps[state.stepIdx];
  document.getElementById('chapter-name').textContent = ch.name;
  document.getElementById('step-counter').textContent = `${state.stepIdx+1}/${ch.steps.length}`;
  document.getElementById('step-badge').textContent = step.badge;
  document.getElementById('lesson-title').textContent = step.title;
  document.getElementById('question-body').innerHTML = step.question;
  document.getElementById('code-editor').value = step.starterCode;
  document.getElementById('output-area').innerHTML = '<span class="out-muted">// Ready for PostgreSQL</span>';
  document.getElementById('output-dot').className = 'output-dot';
  let progress = ((state.stepIdx) / ch.steps.length) * 100;
  document.getElementById('progress-fill').style.width = progress + '%';
  updateLineNums();
  updateStats();
}
function updateStats() {
  document.getElementById('xp-count').innerText = state.xp;
  document.getElementById('streak-count').innerText = state.streak;
  document.getElementById('level-count').innerText = Math.floor(state.xp / 500) + 1;
}
function updateLineNums() {
  const ta = document.getElementById('code-editor');
  const lines = ta.value.split('\n').length;
  document.getElementById('line-nums').innerHTML = Array(lines).fill().map((_,i)=>i+1).join('\n');
}
function handleTab(e) { if(e.key==='Tab'){ e.preventDefault(); const ta=e.target; const s=ta.selectionStart; ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(s); ta.selectionStart=ta.selectionEnd=s+2; updateLineNums(); } }
function resetCode() { loadStep(); }
function toggleHint(btn) { const hint = btn.nextElementSibling; hint.classList.toggle('show'); btn.innerText = hint.classList.contains('show') ? '🙈 Hide' : '💡 Hint'; state.hintUsed = true; }

function checkCode() {
  let code = document.getElementById('code-editor').value;
  const step = curriculum[state.chapterIdx].steps[state.stepIdx];
  const outDiv = document.getElementById('output-area');
  const dot = document.getElementById('output-dot');
  dot.className = 'output-dot';
  outDiv.innerHTML = `<span class="out-info">⏳ Validating PostgreSQL syntax...</span>`;

  setTimeout(() => {
    let result = step.check(code);
    if(result.ok) {
      dot.className = 'output-dot success';
      outDiv.innerHTML = `<span class="out-success">✓ PostgreSQL syntax correct! ${result.output || ''}</span>`;
      const stepKey = `${state.chapterIdx}-${state.stepIdx}`;
      if(!state.completedSteps.has(stepKey)){
        let earned = state.hintUsed ? Math.floor(step.xp * 0.7) : step.xp;
        state.xp += earned;
        state.streak++;
        state.completedSteps.add(stepKey);
        updateStats();
        showFeedback(true, earned);
        burstParticles();
      } else { showFeedback(true, 0); }
    } else {
      dot.className = 'output-dot error';
      outDiv.innerHTML = `<span class="out-error">✗ ${result.msg}</span>`;
      state.streak = 0;
      updateStats();
      shakeEditor();
    }
    state.hintUsed = false;
  }, 200);
}

function showFeedback(success, earned) {
  const overlay = document.getElementById('feedback-overlay');
  const titleDiv = document.getElementById('feedback-title');
  const msgDiv = document.getElementById('feedback-msg');
  const xpSpan = document.getElementById('xp-gained');
  if(success){
    titleDiv.innerText = '🐘 PostgreSQL Master!';
    msgDiv.innerText = 'Excellent query! You\'re mastering PostgreSQL.';
    xpSpan.innerText = earned > 0 ? `+${earned} XP` : 'Already completed';
    overlay.classList.add('show');
  }
}
function nextStep() {
  document.getElementById('feedback-overlay').classList.remove('show');
  const ch = curriculum[state.chapterIdx];
  if(state.stepIdx < ch.steps.length - 1) { state.stepIdx++; }
  else {
    state.completedChapters.add(state.chapterIdx);
    if(state.chapterIdx < curriculum.length-1){
      state.chapterIdx++;
      state.stepIdx = 0;
    }
    buildChapterNav();
  }
  loadStep();
}
function shakeEditor() { const e = document.querySelector('.editor-panel'); e.style.transform = 'translateX(-4px)'; setTimeout(()=>e.style.transform='translateX(4px)',100); setTimeout(()=>e.style.transform='translateX(0)',200); }
function burstParticles() {
  for(let i=0;i<24;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const x = window.innerWidth/2;
    const y = window.innerHeight/2;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.backgroundColor = '#00c4d8';
    const angle = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 110;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function init() { buildChapterNav(); loadStep(); updateStats(); }
init();
</script>
