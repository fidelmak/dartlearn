
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSQuest — Learn JavaScript by Doing | Full Tutorial</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #0f1424;
    --border: #1e2a45;
    --js-yellow: #f7df1e;
    --js-gold: #f5a623;
    --js-blue: #2c3e66;
    --js-pink: #ff3cac;
    --success: #00ff87;
    --error: #ff4444;
    --text: #e8eaf6;
    --muted: #5a6a8a;
    --code-bg: #080c18;
    --glow: 0 0 20px rgba(247,223,30,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(247,223,30,0.02) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(247,223,30,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,20,36,0.95);
    backdrop-filter: blur(12px);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 1.3rem;
    background: linear-gradient(90deg, var(--js-yellow), var(--js-gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo span { background: linear-gradient(90deg, var(--js-pink), var(--js-yellow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .donate-badge {
    background: rgba(247,223,30,0.1);
    border: 1px solid var(--js-yellow);
    border-radius: 40px;
    padding: 6px 14px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--js-yellow);
    letter-spacing: 0.02em;
  }
  .donate-badge strong { color: white; font-family: monospace; }

  .progress-bar-wrap {
    flex: 1;
    max-width: 400px;
    min-width: 180px;
  }
  .progress-label {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--js-yellow), var(--js-gold));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .stats {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 600;
    background: var(--border);
    padding: 5px 12px;
    border-radius: 99px;
  }
  .stat-pill.xp { color: var(--success); }
  .stat-pill.streak { color: var(--js-yellow); }
  .stat-pill.level { color: var(--js-gold); }

  .chapter-nav {
    display: flex;
    gap: 0;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.8);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chapter-nav::-webkit-scrollbar { display: none; }
  .chapter-tab {
    padding: 10px 20px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chapter-tab.active { color: var(--js-yellow); border-bottom-color: var(--js-yellow); }
  .chapter-tab.done { color: var(--success); }
  .chapter-tab.locked { opacity: 0.35; cursor: not-allowed; }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  .question-panel {
    width: 42%;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--panel);
  }
  .panel-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .step-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(247,223,30,0.12);
    color: var(--js-yellow);
    border: 1px solid rgba(247,223,30,0.3);
  }
  .lesson-title { font-family: 'Unbounded', sans-serif; font-size: 0.85rem; font-weight: 700; }

  .question-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    scrollbar-width: thin;
  }
  .concept-block { margin-bottom: 24px; animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .concept-label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--js-pink);
    margin-bottom: 8px;
  }
  .concept-text { font-size: 0.88rem; line-height: 1.7; color: #b8c5e0; }
  .concept-text code, .example-block code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--code-bg);
    color: var(--js-yellow);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.8rem;
  }
  .example-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 16px 0;
    position: relative;
  }
  .example-block pre {
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    color: #e2e8f0;
  }
  .task-block {
    background: rgba(247,223,30,0.05);
    border: 1px solid rgba(247,223,30,0.2);
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
  }
  .task-title {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--js-yellow);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hint-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.7rem;
    margin-top: 12px;
  }
  .hint-reveal {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: rgba(247,223,30,0.05);
    border-left: 3px solid var(--js-yellow);
    font-family: monospace;
    font-size: 0.75rem;
  }
  .hint-reveal.show { display: block; }

  .editor-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--code-bg);
    overflow: hidden;
  }
  .editor-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,20,36,0.8);
  }
  .file-tab {
    font-family: monospace;
    font-size: 0.75rem;
    color: var(--js-yellow);
    background: rgba(247,223,30,0.1);
    padding: 4px 14px;
    border-radius: 4px;
  }
  .editor-actions { display: flex; gap: 10px; }
  .run-btn {
    background: linear-gradient(135deg, var(--js-yellow), var(--js-gold));
    color: #000;
    border: none;
    padding: 6px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .editor-wrap { display: flex; flex: 1; overflow: hidden; }
  .line-nums {
    padding: 16px 0;
    text-align: right;
    font-family: monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: var(--muted);
    padding-right: 12px;
    padding-left: 10px;
    background: rgba(0,0,0,0.2);
    border-right: 1px solid var(--border);
    min-width: 48px;
  }
  #code-editor {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #eeffff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    padding: 16px;
    resize: none;
    white-space: pre;
    overflow: auto;
  }
  .output-panel {
    height: 150px;
    border-top: 1px solid var(--border);
    background: #05080f;
    display: flex;
    flex-direction: column;
  }
  .output-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .output-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .output-dot.success { background: var(--success); }
  .output-dot.error { background: var(--error); }
  #output-area {
    flex: 1;
    padding: 10px 16px;
    font-family: monospace;
    font-size: 0.75rem;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .feedback-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s;
  }
  .feedback-overlay.show { opacity: 1; pointer-events: all; }
  .feedback-card {
    background: var(--panel);
    border-radius: 24px;
    padding: 32px;
    text-align: center;
    max-width: 380px;
    border: 1px solid var(--js-yellow);
  }
  .continue-btn {
    background: linear-gradient(135deg, var(--js-yellow), var(--js-gold));
    border: none;
    padding: 12px 28px;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
    color: #000;
  }
  .particle {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1000;
    animation: blast 0.8s ease-out forwards;
  }
  @keyframes blast {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">JS<span>Quest</span></div>
  <div class="donate-badge">✨ Support JavaScript education — OPay: <strong>9072210193</strong> Paul</div>
  <div class="progress-bar-wrap">
    <div class="progress-label"><span id="chapter-name">JS Basics</span><span id="step-counter">0/0</span></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="stats">
    <div class="stat-pill xp">⚡ <span id="xp-count">0</span> XP</div>
    <div class="stat-pill streak">🔥 <span id="streak-count">0</span></div>
    <div class="stat-pill level">Lv <span id="level-count">1</span></div>
  </div>
</header>

<nav class="chapter-nav" id="chapter-nav"></nav>

<div class="main">
  <div class="question-panel">
    <div class="panel-header"><div class="step-badge" id="step-badge">STEP 1</div><div class="lesson-title" id="lesson-title">Intro</div></div>
    <div class="question-body" id="question-body"></div>
  </div>
  <div class="editor-panel">
    <div class="editor-topbar"><div class="file-tab">📜 script.js</div><div class="editor-actions"><button class="reset-btn" onclick="resetCode()">↺ Reset</button><button class="run-btn" onclick="checkCode()">▶ Run & Check</button></div></div>
    <div class="editor-wrap"><div class="line-nums" id="line-nums">1</div><textarea id="code-editor" spellcheck="false" onkeydown="handleTab(event)" oninput="updateLineNums()"></textarea></div>
    <div class="output-panel"><div class="output-header"><div class="output-dot" id="output-dot"></div>CONSOLE OUTPUT</div><div id="output-area"><span class="out-muted">// Write JavaScript and click Run</span></div></div>
  </div>
</div>

<div class="feedback-overlay" id="feedback-overlay"><div class="feedback-card"><span class="feedback-emoji" id="feedback-emoji">🎉</span><div class="feedback-title" id="feedback-title">Correct!</div><div class="feedback-msg" id="feedback-msg"></div><div id="xp-gained" style="color:var(--js-yellow); margin:12px 0; font-weight:bold;"></div><button class="continue-btn" onclick="nextStep()">Continue →</button></div></div>

<script>
// ============================================================
// JAVASCRIPT CURRICULUM — from basics to advanced (ES6+, promises, async, DOM, classes)
// ============================================================
const curriculum = [
  { id: 'basics', name: 'JS Basics', icon: '📜', steps: [
    { title: 'Hello, World!', badge: 'LESSON 1', xp: 30,
      question: `<div class="concept-block"><div class="concept-label">Your First JS</div><div class="concept-text">JavaScript runs in browsers/Node. <code>console.log()</code> prints to console. End statements with semicolon (optional but good).</div></div>
      <div class="example-block"><pre>console.log("Hello World!");</pre></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Use <code>console.log()</code> to print <code>JavaScript is powerful</code>.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">console.log("JavaScript is powerful");</div></div>`,
      starterCode: `// Print "JavaScript is powerful"\n`,
      check: (code) => { const ok = /console\.log\s*\(\s*['"]JavaScript is powerful['"]\s*\)/.test(code); return { ok, msg: ok ? '' : 'Use console.log("JavaScript is powerful")' }; }
    },
    { title: 'Variables (let, const)', badge: 'LESSON 2', xp: 40,
      question: `<div class="concept-block"><div class="concept-label">let vs const</div><div class="concept-text"><code>let</code> for reassignable, <code>const</code> for constants. Avoid <code>var</code>.</div></div>
      <div class="example-block"><pre>let age = 25;\nconst birthYear = 1998;</pre></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Declare <code>let country = "Nigeria"</code> and <code>const PI = 3.14159</code>. Then <code>console.log(country)</code> and <code>console.log(PI)</code>.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">let country = "Nigeria"; const PI = 3.14159; console.log(country); console.log(PI);</div></div>`,
      starterCode: `// declare variables\n`,
      check: (code) => { return { ok: /let\s+country\s*=\s*['"]Nigeria['"]/.test(code) && /const\s+PI\s*=\s*3\.14159/.test(code) && /console\.log.*country/.test(code), msg: 'Use let country, const PI, then log both' }; }
    },
    { title: 'Functions', badge: 'LESSON 3', xp: 50,
      question: `<div class="concept-block"><div class="concept-label">Declaring Functions</div><div class="concept-text"><code>function name(parameters) { return }</code> or arrow functions.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Write an arrow function <code>multiply = (a,b) => a * b</code>. Call it with (4,5) and log result.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">const multiply = (a,b) => a * b; console.log(multiply(4,5));</div></div>`,
      starterCode: `// arrow function multiply\n`,
      check: (code) => { return { ok: /multiply\s*=\s*\([^)]*\)\s*=>/.test(code) && /console\.log.*multiply\(4,5\)/.test(code), msg: 'Define arrow function and log multiply(4,5) (should be 20)' }; }
    }
  ]},
  { id: 'arrays', name: 'Arrays & Loops', icon: '🔄', steps: [
    { title: 'Array Methods', badge: 'LESSON 1', xp: 55,
      question: `<div class="concept-block"><div class="concept-label">Powerful array tools</div><div class="concept-text"><code>map()</code>, <code>filter()</code>, <code>forEach()</code> are essential.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Given <code>const nums = [1,2,3,4];</code> use <code>.map()</code> to double each number, then log new array.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">const doubled = nums.map(n => n * 2); console.log(doubled);</div></div>`,
      starterCode: `const nums = [1,2,3,4];\n// use map to double\n`,
      check: (code) => { return { ok: /\.map\s*\(/.test(code) && /n\s*\*\s*2/.test(code) && /console\.log/.test(code), msg: 'Use map to double each number, output [2,4,6,8]' }; }
    },
    { title: 'Destructuring', badge: 'LESSON 2', xp: 60,
      question: `<div class="concept-block"><div class="concept-label">ES6 Destructuring</div><div class="concept-text">Unpack values from arrays or objects.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Given <code>const colors = ["red","green","blue"];</code> destructure the first two elements into variables <code>first</code> and <code>second</code> and log them.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">const [first, second] = colors; console.log(first, second);</div></div>`,
      starterCode: `const colors = ["red","green","blue"];\n// destructure\n`,
      check: (code) => { return { ok: /const\s*\[\s*first\s*,\s*second\s*\]\s*=\s*colors/.test(code) && /console\.log\(first,\s*second\)/.test(code), msg: 'Destructure first two elements and log' }; }
    }
  ]},
  { id: 'objects', name: 'Objects & this', icon: '🏷️', steps: [
    { title: 'Object Literals', badge: 'LESSON 1', xp: 65,
      question: `<div class="concept-block"><div class="concept-label">Key-value storage</div><div class="concept-text">Objects group data.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Create object <code>person</code> with properties <code>name: "Zara"</code>, <code>age: 22</code>. Then log "Zara is 22 years old".</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">const person = { name: "Zara", age: 22 }; console.log(\`$\{person.name} is $\{person.age} years old\`);</div></div>`,
      starterCode: `// create person object\n`,
      check: (code) => { return { ok: /person\s*=\s*\{\s*name:\s*['"]Zara['"]/.test(code) && /console\.log.*`.*\$\{person\.name\}.*\$\{person\.age\}`/.test(code), msg: 'Create person and log template literal' }; }
    },
    { title: 'Methods & this', badge: 'LESSON 2', xp: 70,
      question: `<div class="concept-block"><div class="concept-label">Object Methods</div><div class="concept-text">Functions inside objects using <code>this</code>.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Create object <code>calculator</code> with method <code>add(a,b)</code> that returns sum. Call <code>calculator.add(10,5)</code> and log result.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">const calculator = { add(a,b) { return a+b; } }; console.log(calculator.add(10,5));</div></div>`,
      starterCode: `// calculator object with add method\n`,
      check: (code) => { return { ok: /calculator\s*=\s*\{\s*add\s*\(/.test(code) && /calculator\.add\(10,5\)/.test(code), msg: 'Create calculator.add method that returns sum, log 15' }; }
    }
  ]},
  { id: 'promises', name: 'Promises & Async', icon: '⏳', steps: [
    { title: 'Creating a Promise', badge: 'LESSON 1', xp: 80,
      question: `<div class="concept-block"><div class="concept-label">Async operations</div><div class="concept-text">Promise handles future value. Use <code>resolve/reject</code>.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Create a Promise that resolves with <code>"Success!"</code> after 100ms using <code>setTimeout</code>. Use <code>.then()</code> to log the result.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">new Promise(resolve => setTimeout(() => resolve("Success!"), 100)).then(console.log);</div></div>`,
      starterCode: `// create and consume promise\n`,
      check: (code) => { const hasPromise = /new\s+Promise/.test(code); const hasThen = /\.then\s*\(/.test(code); return { ok: hasPromise && hasThen, msg: 'Create promise that resolves after timeout and log' }; }
    },
    { title: 'Async/Await', badge: 'LESSON 2', xp: 90,
      question: `<div class="concept-block"><div class="concept-label">Syntactic sugar</div><div class="concept-text"><code>async function</code> and <code>await</code> simplify promises.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Write an <code>async function fetchMessage()</code> that awaits a resolved promise "Async is awesome" and logs it. Call the function.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">async function fetchMessage() { const msg = await Promise.resolve("Async is awesome"); console.log(msg); } fetchMessage();</div></div>`,
      starterCode: `// async function\n`,
      check: (code) => { return { ok: /async\s+function\s+fetchMessage/.test(code) && /await/.test(code) && /fetchMessage\(\)/.test(code), msg: 'Define async function, await promise, log message' }; }
    }
  ]},
  { id: 'classes', name: 'ES6 Classes', icon: '🏛️', steps: [
    { title: 'Class & Constructor', badge: 'LESSON 1', xp: 85,
      question: `<div class="concept-block"><div class="concept-label">Object-oriented JS</div><div class="concept-text">Classes with constructor, methods.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Create class <code>Animal</code> with constructor taking <code>name</code> and method <code>speak()</code> returning <code>"... sound"</code>. Instantiate <code>new Animal("Dog")</code> and log <code>speak()</code>.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">class Animal { constructor(name) { this.name = name; } speak() { return this.name + " says woof"; } } const a = new Animal("Dog"); console.log(a.speak());</div></div>`,
      starterCode: `// define Animal class\n`,
      check: (code) => { return { ok: /class\s+Animal/.test(code) && /constructor\s*\(/.test(code) && /speak\s*\(\)/.test(code) && /new\s+Animal/.test(code), msg: 'Define Animal class with constructor and speak method, instantiate and log' }; }
    }
  ]},
  { id: 'dom', name: 'DOM Manipulation', icon: '🌳', steps: [
    { title: 'Select & Modify', badge: 'LESSON 1', xp: 75,
      question: `<div class="concept-block"><div class="concept-label">Browser API</div><div class="concept-text"><code>document.querySelector</code> and modify content.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Select element with id <code>testDiv</code> (assume exists) and change its <code>innerText</code> to "DOM Updated!".</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">const el = document.getElementById("testDiv"); el.innerText = "DOM Updated!";</div></div>`,
      starterCode: `// DOM selection and update\n`,
      check: (code) => { return { ok: /getElementById\s*\(\s*['"]testDiv['"]\s*\)/.test(code) || /querySelector\s*\(\s*['"]#testDiv['"]/.test(code), msg: 'Select element with id testDiv and update its innerText' }; }
    }
  ]}
];

// State
let state = {
  chapterIdx: 0, stepIdx: 0, xp: 0, streak: 0,
  completedSteps: new Set(),
  completedChapters: new Set(),
  hintUsed: false
};

function buildChapterNav() {
  const nav = document.getElementById('chapter-nav');
  nav.innerHTML = '';
  curriculum.forEach((ch, i) => {
    const tab = document.createElement('div');
    tab.className = `chapter-tab ${i === state.chapterIdx ? 'active' : ''} ${state.completedChapters.has(i) ? 'done' : ''} ${!isUnlocked(i) ? 'locked' : ''}`;
    tab.textContent = ch.icon + ' ' + ch.name;
    tab.onclick = () => { if(isUnlocked(i)) { state.chapterIdx = i; state.stepIdx = 0; buildChapterNav(); loadStep(); } };
    nav.appendChild(tab);
  });
}
function isUnlocked(i) { if(i===0) return true; return state.completedChapters.has(i-1) || state.chapterIdx === i; }

function loadStep() {
  const ch = curriculum[state.chapterIdx];
  const step = ch.steps[state.stepIdx];
  document.getElementById('chapter-name').textContent = ch.name;
  document.getElementById('step-counter').textContent = `${state.stepIdx+1}/${ch.steps.length}`;
  document.getElementById('step-badge').textContent = step.badge;
  document.getElementById('lesson-title').textContent = step.title;
  document.getElementById('question-body').innerHTML = step.question;
  document.getElementById('code-editor').value = step.starterCode;
  document.getElementById('output-area').innerHTML = '<span class="out-muted">// Ready to run JS</span>';
  document.getElementById('output-dot').className = 'output-dot';
  let progress = ((state.stepIdx) / ch.steps.length) * 100;
  document.getElementById('progress-fill').style.width = progress + '%';
  updateLineNums();
  updateStats();
}
function updateStats() {
  document.getElementById('xp-count').innerText = state.xp;
  document.getElementById('streak-count').innerText = state.streak;
  document.getElementById('level-count').innerText = Math.floor(state.xp / 400) + 1;
}
function updateLineNums() {
  const ta = document.getElementById('code-editor');
  const lines = ta.value.split('\n').length;
  document.getElementById('line-nums').innerHTML = Array(lines).fill().map((_,i)=>i+1).join('\n');
}
function handleTab(e) { if(e.key==='Tab'){ e.preventDefault(); const ta=e.target; const s=ta.selectionStart; ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(s); ta.selectionStart=ta.selectionEnd=s+2; updateLineNums(); } }
function resetCode() { loadStep(); }
function toggleHint(btn) { const hint = btn.nextElementSibling; hint.classList.toggle('show'); btn.innerText = hint.classList.contains('show') ? '🙈 Hide' : '💡 Hint'; state.hintUsed = true; }

function checkCode() {
  let code = document.getElementById('code-editor').value;
  const step = curriculum[state.chapterIdx].steps[state.stepIdx];
  const outDiv = document.getElementById('output-area');
  const dot = document.getElementById('output-dot');
  dot.className = 'output-dot';
  outDiv.innerHTML = `<span class="out-info">⏳ Evaluating...</span>`;

  setTimeout(() => {
    let result = step.check(code);
    if(result.ok) {
      dot.className = 'output-dot success';
      outDiv.innerHTML = `<span class="out-success">✓ Correct! ${result.output || ''}</span>`;
      const stepKey = `${state.chapterIdx}-${state.stepIdx}`;
      if(!state.completedSteps.has(stepKey)){
        let earned = state.hintUsed ? Math.floor(step.xp * 0.7) : step.xp;
        state.xp += earned;
        state.streak++;
        state.completedSteps.add(stepKey);
        updateStats();
        showFeedback(true, earned);
        burstParticles();
      } else { showFeedback(true, 0); }
    } else {
      dot.className = 'output-dot error';
      outDiv.innerHTML = `<span class="out-error">✗ ${result.msg || 'Try again!'}</span>`;
      state.streak = 0;
      updateStats();
      shakeEditor();
    }
    state.hintUsed = false;
  }, 200);
}

function showFeedback(success, earned) {
  const overlay = document.getElementById('feedback-overlay');
  const titleDiv = document.getElementById('feedback-title');
  const msgDiv = document.getElementById('feedback-msg');
  const xpSpan = document.getElementById('xp-gained');
  if(success){
    titleDiv.innerText = '🎉 Correct!';
    msgDiv.innerText = 'Great! You\'re leveling up your JS skills.';
    xpSpan.innerText = earned > 0 ? `+${earned} XP` : 'Already completed';
    overlay.classList.add('show');
  }
}
function nextStep() {
  document.getElementById('feedback-overlay').classList.remove('show');
  const ch = curriculum[state.chapterIdx];
  if(state.stepIdx < ch.steps.length - 1) { state.stepIdx++; }
  else {
    state.completedChapters.add(state.chapterIdx);
    if(state.chapterIdx < curriculum.length-1){
      state.chapterIdx++;
      state.stepIdx = 0;
    }
    buildChapterNav();
  }
  loadStep();
}
function shakeEditor() { const e = document.querySelector('.editor-panel'); e.style.transform = 'translateX(-4px)'; setTimeout(()=>e.style.transform='translateX(4px)',100); setTimeout(()=>e.style.transform='translateX(0)',200); }
function burstParticles() {
  for(let i=0;i<24;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const x = window.innerWidth/2;
    const y = window.innerHeight/2;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.backgroundColor = '#f7df1e';
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 100;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function init() { buildChapterNav(); loadStep(); updateStats(); }
init();
</script>
</body>
