
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQLQuest — Learn SQL by Doing | Full Tutorial</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #0f1424;
    --border: #1e2a45;
    --sql-blue: #00758f;
    --sql-orange: #f29111;
    --sql-pink: #ff3cac;
    --sql-teal: #00e5cc;
    --success: #00ff87;
    --error: #ff4444;
    --text: #e8eaf6;
    --muted: #5a6a8a;
    --code-bg: #080c18;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(0,117,143,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,117,143,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,20,36,0.95);
    backdrop-filter: blur(12px);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 1.3rem;
    background: linear-gradient(90deg, var(--sql-blue), var(--sql-teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo span { background: linear-gradient(90deg, var(--sql-orange), var(--sql-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .donate-badge {
    background: rgba(242,145,17,0.12);
    border: 1px solid var(--sql-orange);
    border-radius: 40px;
    padding: 6px 14px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--sql-orange);
    letter-spacing: 0.02em;
  }
  .donate-badge strong { color: white; font-family: monospace; }

  .progress-bar-wrap {
    flex: 1;
    max-width: 400px;
    min-width: 180px;
  }
  .progress-label {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sql-blue), var(--sql-teal));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .stats {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 600;
    background: var(--border);
    padding: 5px 12px;
    border-radius: 99px;
  }
  .stat-pill.xp { color: var(--success); }
  .stat-pill.streak { color: var(--sql-orange); }
  .stat-pill.level { color: var(--sql-blue); }

  .chapter-nav {
    display: flex;
    gap: 0;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.8);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chapter-nav::-webkit-scrollbar { display: none; }
  .chapter-tab {
    padding: 10px 20px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chapter-tab.active { color: var(--sql-teal); border-bottom-color: var(--sql-teal); }
  .chapter-tab.done { color: var(--success); }
  .chapter-tab.locked { opacity: 0.35; cursor: not-allowed; }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  .question-panel {
    width: 45%;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--panel);
  }
  .panel-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .step-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(0,117,143,0.12);
    color: var(--sql-teal);
    border: 1px solid rgba(0,117,143,0.3);
  }
  .lesson-title { font-family: 'Unbounded', sans-serif; font-size: 0.85rem; font-weight: 700; }

  .question-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    scrollbar-width: thin;
  }
  .concept-block { margin-bottom: 24px; animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .concept-label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sql-pink);
    margin-bottom: 8px;
  }
  .concept-text { font-size: 0.88rem; line-height: 1.7; color: #b8c5e0; }
  .concept-text code, .example-block code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--code-bg);
    color: var(--sql-orange);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.8rem;
  }
  .example-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 16px 0;
  }
  .example-block pre {
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    color: #e2e8f0;
  }
  .schema-block {
    background: rgba(0,229,204,0.05);
    border: 1px solid rgba(0,229,204,0.2);
    border-radius: 8px;
    padding: 12px;
    margin: 12px 0;
    font-size: 0.7rem;
    font-family: monospace;
  }
  .task-block {
    background: rgba(242,145,17,0.05);
    border: 1px solid rgba(242,145,17,0.2);
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
  }
  .task-title {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--sql-orange);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hint-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.7rem;
    margin-top: 12px;
  }
  .hint-reveal {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: rgba(242,145,17,0.05);
    border-left: 3px solid var(--sql-orange);
    font-family: monospace;
    font-size: 0.75rem;
  }
  .hint-reveal.show { display: block; }

  .editor-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--code-bg);
    overflow: hidden;
  }
  .editor-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,20,36,0.8);
  }
  .file-tab {
    font-family: monospace;
    font-size: 0.75rem;
    color: var(--sql-teal);
    background: rgba(0,229,204,0.1);
    padding: 4px 14px;
    border-radius: 4px;
  }
  .editor-actions { display: flex; gap: 10px; }
  .run-btn {
    background: linear-gradient(135deg, var(--sql-blue), var(--sql-teal));
    color: #000;
    border: none;
    padding: 6px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .editor-wrap { display: flex; flex: 1; overflow: hidden; }
  .line-nums {
    padding: 16px 0;
    text-align: right;
    font-family: monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: var(--muted);
    padding-right: 12px;
    padding-left: 10px;
    background: rgba(0,0,0,0.2);
    border-right: 1px solid var(--border);
    min-width: 48px;
  }
  #code-editor {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #eeffff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    padding: 16px;
    resize: none;
    white-space: pre;
    overflow: auto;
  }
  .output-panel {
    height: 170px;
    border-top: 1px solid var(--border);
    background: #05080f;
    display: flex;
    flex-direction: column;
  }
  .output-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .output-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .output-dot.success { background: var(--success); }
  .output-dot.error { background: var(--error); }
  #output-area {
    flex: 1;
    padding: 10px 16px;
    font-family: monospace;
    font-size: 0.75rem;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .feedback-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s;
  }
  .feedback-overlay.show { opacity: 1; pointer-events: all; }
  .feedback-card {
    background: var(--panel);
    border-radius: 24px;
    padding: 32px;
    text-align: center;
    max-width: 380px;
    border: 1px solid var(--sql-teal);
  }
  .continue-btn {
    background: linear-gradient(135deg, var(--sql-blue), var(--sql-teal));
    border: none;
    padding: 12px 28px;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
    color: #000;
  }
  .particle {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1000;
    animation: blast 0.8s ease-out forwards;
  }
  @keyframes blast {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
  .keyword { color: var(--sql-teal); font-weight: 600; }
  .string { color: var(--sql-orange); }
  .number { color: var(--sql-pink); }
</style>
</head>
<body>

<header>
  <div class="logo">SQL<span>Quest</span></div>
  <div class="donate-badge">🗄️ Support SQL education — OPay: <strong>9072210193</strong> Paul</div>
  <div class="progress-bar-wrap">
    <div class="progress-label"><span id="chapter-name">SQL Basics</span><span id="step-counter">0/0</span></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="stats">
    <div class="stat-pill xp">⚡ <span id="xp-count">0</span> XP</div>
    <div class="stat-pill streak">🔥 <span id="streak-count">0</span></div>
    <div class="stat-pill level">Lv <span id="level-count">1</span></div>
  </div>
</header>

<nav class="chapter-nav" id="chapter-nav"></nav>

<div class="main">
  <div class="question-panel">
    <div class="panel-header"><div class="step-badge" id="step-badge">LESSON</div><div class="lesson-title" id="lesson-title">Intro to SQL</div></div>
    <div class="question-body" id="question-body"></div>
  </div>
  <div class="editor-panel">
    <div class="editor-topbar"><div class="file-tab">🗄️ query.sql</div><div class="editor-actions"><button class="reset-btn" onclick="resetCode()">↺ Reset</button><button class="run-btn" onclick="checkCode()">▶ Execute SQL</button></div></div>
    <div class="editor-wrap"><div class="line-nums" id="line-nums">1</div><textarea id="code-editor" spellcheck="false" onkeydown="handleTab(event)" oninput="updateLineNums()"></textarea></div>
    <div class="output-panel"><div class="output-header"><div class="output-dot" id="output-dot"></div>QUERY RESULT</div><div id="output-area"><span class="out-muted">// Write SQL and click Execute</span></div></div>
  </div>
</div>

<div class="feedback-overlay" id="feedback-overlay"><div class="feedback-card"><span class="feedback-emoji" id="feedback-emoji">🏆</span><div class="feedback-title" id="feedback-title">Correct!</div><div class="feedback-msg" id="feedback-msg"></div><div id="xp-gained" style="color:var(--sql-teal); margin:12px 0; font-weight:bold;"></div><button class="continue-btn" onclick="nextStep()">Next Challenge →</button></div></div>

<script>
// ============================================================
// SQL CURRICULUM — from basic SELECT to JOINs, subqueries, indexes, transactions
// ============================================================

// Simulated database schema for validation
const schemaInfo = {
  users: { columns: ['id', 'name', 'email', 'age', 'city'], rows: [[1,'Alice','alice@mail.com',25,'NYC'],[2,'Bob','bob@mail.com',30,'LA'],[3,'Charlie','charlie@mail.com',22,'Chicago']] },
  products: { columns: ['id', 'name', 'price', 'category', 'stock'], rows: [[1,'Laptop',1200,'Electronics',10],[2,'Mouse',25,'Electronics',50],[3,'Monitor',300,'Electronics',8]] },
  orders: { columns: ['id', 'user_id', 'product_id', 'quantity', 'order_date'], rows: [[1,1,1,1,'2024-01-15'],[2,2,2,3,'2024-01-16'],[3,1,3,1,'2024-01-20']] }
};

const curriculum = [
  { id: 'select', name: 'SELECT Basics', icon: '🔍', steps: [
    { title: 'Simple SELECT', badge: 'LESSON 1', xp: 30,
      question: `<div class="concept-block"><div class="concept-label">Retrieving Data</div><div class="concept-text">The <code>SELECT</code> statement fetches data from a table. <code>SELECT * FROM table</code> gets all columns.</div></div>
      <div class="schema-block">📊 <strong>Table: users</strong><br>id | name | email | age | city</div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Write a query to select <strong>all columns and all rows</strong> from the <code>users</code> table.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT * FROM users;</div></div>`,
      starterCode: `-- Write your SQL query here\n`,
      check: (code) => { const ok = /SELECT\s+\*\s+FROM\s+users/i.test(code); return { ok, msg: ok ? '' : 'Use: SELECT * FROM users;' }; }
    },
    { title: 'SELECT Specific Columns', badge: 'LESSON 2', xp: 35,
      question: `<div class="concept-block"><div class="concept-label">Column Selection</div><div class="concept-text">List only the columns you need: <code>SELECT name, city FROM users</code></div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Select only <code>name</code> and <code>email</code> columns from the <code>users</code> table.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT name, email FROM users;</div></div>`,
      starterCode: `-- SELECT name and email\n`,
      check: (code) => { const ok = /SELECT\s+name\s*,\s*email\s+FROM\s+users/i.test(code); return { ok, msg: 'SELECT name, email FROM users;' }; }
    },
    { title: 'WHERE Filter', badge: 'LESSON 3', xp: 40,
      question: `<div class="concept-block"><div class="concept-label">Filtering Rows</div><div class="concept-text"><code>WHERE</code> clause filters results based on conditions.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Select all users whose <code>age</code> is greater than 25.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT * FROM users WHERE age > 25;</div></div>`,
      starterCode: `-- Filter users older than 25\n`,
      check: (code) => { const ok = /SELECT.*FROM\s+users\s+WHERE\s+age\s*>\s*25/i.test(code); return { ok, msg: 'SELECT * FROM users WHERE age > 25;' }; }
    }
  ]},
  { id: 'aggregate', name: 'Aggregates & GROUP BY', icon: '📊', steps: [
    { title: 'COUNT() Function', badge: 'LESSON 1', xp: 45,
      question: `<div class="concept-block"><div class="concept-label">Counting Rows</div><div class="concept-text"><code>COUNT(*)</code> returns number of rows. Use alias with <code>AS</code>.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Count how many users are in the <code>users</code> table, return as <code>total_users</code>.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT COUNT(*) AS total_users FROM users;</div></div>`,
      starterCode: `-- Count total users\n`,
      check: (code) => { const ok = /COUNT\s*\(\s*\*\s*\)\s+AS\s+total_users\s+FROM\s+users/i.test(code) || /COUNT\(\*\)\s+FROM\s+users/i.test(code); return { ok, msg: 'SELECT COUNT(*) AS total_users FROM users;' }; }
    },
    { title: 'AVG() & GROUP BY', badge: 'LESSON 2', xp: 55,
      question: `<div class="concept-block"><div class="concept-label">Grouping Data</div><div class="concept-text"><code>GROUP BY</code> groups rows; aggregate functions like <code>AVG()</code> work per group.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Calculate the <strong>average age</strong> of users grouped by <code>city</code>.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT city, AVG(age) FROM users GROUP BY city;</div></div>`,
      starterCode: `-- Average age by city\n`,
      check: (code) => { const ok = /SELECT.*city.*AVG\s*\(\s*age\s*\).*GROUP\s+BY\s+city/i.test(code); return { ok, msg: 'SELECT city, AVG(age) FROM users GROUP BY city;' }; }
    }
  ]},
  { id: 'joins', name: 'JOINs', icon: '🔗', steps: [
    { title: 'INNER JOIN', badge: 'LESSON 1', xp: 65,
      question: `<div class="concept-block"><div class="concept-label">Combining Tables</div><div class="concept-text"><code>INNER JOIN</code> returns matching rows from both tables.</div></div>
      <div class="schema-block">📊 users(id,name) | orders(id,user_id,product_id)</div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Join <code>users</code> and <code>orders</code> to show <strong>user name and order id</strong> for matching users.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT users.name, orders.id FROM users INNER JOIN orders ON users.id = orders.user_id;</div></div>`,
      starterCode: `-- JOIN users and orders\n`,
      check: (code) => { const ok = /INNER\s+JOIN\s+orders\s+ON\s+users\.id\s*=\s*orders\.user_id/i.test(code); return { ok, msg: 'Use INNER JOIN with ON condition' }; }
    },
    { title: 'LEFT JOIN', badge: 'LESSON 2', xp: 70,
      question: `<div class="concept-block"><div class="concept-label">All rows from left table</div><div class="concept-text"><code>LEFT JOIN</code> returns all left table rows, even without matches.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">List all users and their order IDs (NULL if no orders).</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT users.name, orders.id FROM users LEFT JOIN orders ON users.id = orders.user_id;</div></div>`,
      starterCode: `-- LEFT JOIN users to orders\n`,
      check: (code) => { const ok = /LEFT\s+JOIN\s+orders\s+ON\s+users\.id\s*=\s*orders\.user_id/i.test(code); return { ok, msg: 'Use LEFT JOIN to include all users' }; }
    }
  ]},
  { id: 'subqueries', name: 'Subqueries', icon: '📦', steps: [
    { title: 'Subquery in WHERE', badge: 'LESSON 1', xp: 75,
      question: `<div class="concept-block"><div class="concept-label">Nested Queries</div><div class="concept-text">Subquery inside WHERE clause filters based on another query's result.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Find users who have placed an order (use subquery with <code>IN</code>).</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT * FROM users WHERE id IN (SELECT user_id FROM orders);</div></div>`,
      starterCode: `-- Subquery: users with orders\n`,
      check: (code) => { const ok = /SELECT.*FROM\s+users\s+WHERE\s+id\s+IN\s*\(\s*SELECT\s+user_id\s+FROM\s+orders\s*\)/i.test(code); return { ok, msg: 'Use subquery with IN to find users with orders' }; }
    }
  ]},
  { id: 'insert-update-delete', name: 'Modifying Data', icon: '✏️', steps: [
    { title: 'INSERT INTO', badge: 'LESSON 1', xp: 50,
      question: `<div class="concept-block"><div class="concept-label">Adding Rows</div><div class="concept-text"><code>INSERT INTO table (columns) VALUES (values)</code></div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Insert a new user: name='David', email='david@mail.com', age=28, city='Miami'.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">INSERT INTO users (name, email, age, city) VALUES ('David', 'david@mail.com', 28, 'Miami');</div></div>`,
      starterCode: `-- INSERT new user\n`,
      check: (code) => { const ok = /INSERT\s+INTO\s+users\s*\([^)]+\)\s*VALUES\s*\([^)]+\)/i.test(code) && /David/i.test(code); return { ok, msg: 'Write INSERT INTO statement with name, email, age, city' }; }
    },
    { title: 'UPDATE', badge: 'LESSON 2', xp: 55,
      question: `<div class="concept-block"><div class="concept-label">Updating Records</div><div class="concept-text"><code>UPDATE table SET column = value WHERE condition</code></div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Update user with id=2: change city to 'San Francisco'.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">UPDATE users SET city = 'San Francisco' WHERE id = 2;</div></div>`,
      starterCode: `-- UPDATE user city\n`,
      check: (code) => { const ok = /UPDATE\s+users\s+SET\s+city\s*=\s*['"]San Francisco['"]\s+WHERE\s+id\s*=\s*2/i.test(code); return { ok, msg: 'UPDATE users SET city = "San Francisco" WHERE id = 2;' }; }
    },
    { title: 'DELETE', badge: 'LESSON 3', xp: 50,
      question: `<div class="concept-block"><div class="concept-label">Removing Rows</div><div class="concept-text"><code>DELETE FROM table WHERE condition</code></div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Delete the user with name 'Bob'.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">DELETE FROM users WHERE name = 'Bob';</div></div>`,
      starterCode: `-- DELETE Bob\n`,
      check: (code) => { const ok = /DELETE\s+FROM\s+users\s+WHERE\s+name\s*=\s*['"]Bob['"]/i.test(code); return { ok, msg: 'DELETE FROM users WHERE name = "Bob";' }; }
    }
  ]},
  { id: 'advanced', name: 'Advanced SQL', icon: '🚀', steps: [
    { title: 'ORDER BY & LIMIT', badge: 'LESSON 1', xp: 45,
      question: `<div class="concept-block"><div class="concept-label">Sorting & Limiting</div><div class="concept-text"><code>ORDER BY</code> sorts, <code>LIMIT</code> restricts rows.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Select all users sorted by age descending, showing only the oldest 2.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">SELECT * FROM users ORDER BY age DESC LIMIT 2;</div></div>`,
      starterCode: `-- Oldest 2 users\n`,
      check: (code) => { const ok = /ORDER\s+BY\s+age\s+DESC\s+LIMIT\s+2/i.test(code); return { ok, msg: 'ORDER BY age DESC LIMIT 2' }; }
    },
    { title: 'INDEXES', badge: 'ADVANCED', xp: 80,
      question: `<div class="concept-block"><div class="concept-label">Performance Optimization</div><div class="concept-text"><code>CREATE INDEX</code> speeds up queries on columns used in WHERE.</div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Create an index on the <code>email</code> column of the <code>users</code> table.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">CREATE INDEX idx_email ON users(email);</div></div>`,
      starterCode: `-- Create index on email\n`,
      check: (code) => { const ok = /CREATE\s+INDEX\s+\w+\s+ON\s+users\s*\(\s*email\s*\)/i.test(code); return { ok, msg: 'CREATE INDEX idx_email ON users(email);' }; }
    },
    { title: 'TRANSACTIONS', badge: 'EXPERT', xp: 100,
      question: `<div class="concept-block"><div class="concept-label">ACID Compliance</div><div class="concept-text">Transactions ensure atomic operations: <code>BEGIN; ... COMMIT;</code> or <code>ROLLBACK;</code></div></div>
      <div class="task-block"><div class="task-title">⚡ Task</div><div class="task-text">Write a transaction that inserts a new user, then COMMIT.</div><button class="hint-btn" onclick="toggleHint(this)">💡 Hint</button><div class="hint-reveal">BEGIN; INSERT INTO users (name,email,age,city) VALUES ('Test','t@t.com',30,'TestCity'); COMMIT;</div></div>`,
      starterCode: `-- Transaction example\n`,
      check: (code) => { const ok = /BEGIN/i.test(code) && /INSERT\s+INTO\s+users/i.test(code) && /COMMIT/i.test(code); return { ok, msg: 'Use BEGIN, INSERT, then COMMIT' }; }
    }
  ]}
];

// State
let state = {
  chapterIdx: 0, stepIdx: 0, xp: 0, streak: 0,
  completedSteps: new Set(),
  completedChapters: new Set(),
  hintUsed: false
};

function buildChapterNav() {
  const nav = document.getElementById('chapter-nav');
  nav.innerHTML = '';
  curriculum.forEach((ch, i) => {
    const tab = document.createElement('div');
    tab.className = `chapter-tab ${i === state.chapterIdx ? 'active' : ''} ${state.completedChapters.has(i) ? 'done' : ''} ${!isUnlocked(i) ? 'locked' : ''}`;
    tab.textContent = ch.icon + ' ' + ch.name;
    tab.onclick = () => { if(isUnlocked(i)) { state.chapterIdx = i; state.stepIdx = 0; buildChapterNav(); loadStep(); } };
    nav.appendChild(tab);
  });
}
function isUnlocked(i) { if(i===0) return true; return state.completedChapters.has(i-1) || state.chapterIdx === i; }

function loadStep() {
  const ch = curriculum[state.chapterIdx];
  const step = ch.steps[state.stepIdx];
  document.getElementById('chapter-name').textContent = ch.name;
  document.getElementById('step-counter').textContent = `${state.stepIdx+1}/${ch.steps.length}`;
  document.getElementById('step-badge').textContent = step.badge;
  document.getElementById('lesson-title').textContent = step.title;
  document.getElementById('question-body').innerHTML = step.question;
  document.getElementById('code-editor').value = step.starterCode;
  document.getElementById('output-area').innerHTML = '<span class="out-muted">// Write SQL query above</span>';
  document.getElementById('output-dot').className = 'output-dot';
  let progress = ((state.stepIdx) / ch.steps.length) * 100;
  document.getElementById('progress-fill').style.width = progress + '%';
  updateLineNums();
  updateStats();
}
function updateStats() {
  document.getElementById('xp-count').innerText = state.xp;
  document.getElementById('streak-count').innerText = state.streak;
  document.getElementById('level-count').innerText = Math.floor(state.xp / 450) + 1;
}
function updateLineNums() {
  const ta = document.getElementById('code-editor');
  const lines = ta.value.split('\n').length;
  document.getElementById('line-nums').innerHTML = Array(lines).fill().map((_,i)=>i+1).join('\n');
}
function handleTab(e) { if(e.key==='Tab'){ e.preventDefault(); const ta=e.target; const s=ta.selectionStart; ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(s); ta.selectionStart=ta.selectionEnd=s+2; updateLineNums(); } }
function resetCode() { loadStep(); }
function toggleHint(btn) { const hint = btn.nextElementSibling; hint.classList.toggle('show'); btn.innerText = hint.classList.contains('show') ? '🙈 Hide' : '💡 Hint'; state.hintUsed = true; }

function checkCode() {
  let code = document.getElementById('code-editor').value;
  const step = curriculum[state.chapterIdx].steps[state.stepIdx];
  const outDiv = document.getElementById('output-area');
  const dot = document.getElementById('output-dot');
  dot.className = 'output-dot';
  outDiv.innerHTML = `<span class="out-info">⏳ Validating SQL...</span>`;

  setTimeout(() => {
    let result = step.check(code);
    if(result.ok) {
      dot.className = 'output-dot success';
      outDiv.innerHTML = `<span class="out-success">✓ SQL Valid! Query syntax correct. ${result.output || ''}</span>`;
      const stepKey = `${state.chapterIdx}-${state.stepIdx}`;
      if(!state.completedSteps.has(stepKey)){
        let earned = state.hintUsed ? Math.floor(step.xp * 0.7) : step.xp;
        state.xp += earned;
        state.streak++;
        state.completedSteps.add(stepKey);
        updateStats();
        showFeedback(true, earned);
        burstParticles();
      } else { showFeedback(true, 0); }
    } else {
      dot.className = 'output-dot error';
      outDiv.innerHTML = `<span class="out-error">✗ ${result.msg}</span>`;
      state.streak = 0;
      updateStats();
      shakeEditor();
    }
    state.hintUsed = false;
  }, 200);
}

function showFeedback(success, earned) {
  const overlay = document.getElementById('feedback-overlay');
  const titleDiv = document.getElementById('feedback-title');
  const msgDiv = document.getElementById('feedback-msg');
  const xpSpan = document.getElementById('xp-gained');
  if(success){
    titleDiv.innerText = '✅ SQL Mastered!';
    msgDiv.innerText = 'Great query! Keep building database skills.';
    xpSpan.innerText = earned > 0 ? `+${earned} XP` : 'Already completed';
    overlay.classList.add('show');
  }
}
function nextStep() {
  document.getElementById('feedback-overlay').classList.remove('show');
  const ch = curriculum[state.chapterIdx];
  if(state.stepIdx < ch.steps.length - 1) { state.stepIdx++; }
  else {
    state.completedChapters.add(state.chapterIdx);
    if(state.chapterIdx < curriculum.length-1){
      state.chapterIdx++;
      state.stepIdx = 0;
    }
    buildChapterNav();
  }
  loadStep();
}
function shakeEditor() { const e = document.querySelector('.editor-panel'); e.style.transform = 'translateX(-4px)'; setTimeout(()=>e.style.transform='translateX(4px)',100); setTimeout(()=>e.style.transform='translateX(0)',200); }
function burstParticles() {
  for(let i=0;i<24;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const x = window.innerWidth/2;
    const y = window.innerHeight/2;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.backgroundColor = '#00e5cc';
    const angle = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 110;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function init() { buildChapterNav(); loadStep(); updateStats(); }
init();
</script>
